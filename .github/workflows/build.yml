name: build
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: check files
        run: |
          ls -la
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/ru/kopilka/app/MainActivity.java
          test -f app/src/main/assets/www/kopilka.html
          test -f app/src/main/res/drawable/ic_launcher.xml
          echo FILES_OK
      - name: gradle wrapper
        run: gradle wrapper --gradle-version 8.7 --no-daemon
      - name: build
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: kopilka-apk
          path: app/build/outputs/apk/debug/app-debug.apk
