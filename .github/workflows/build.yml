name: build
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: gradle wrapper
        run: gradle wrapper --gradle-version 8.7 --no-daemon
      - name: sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
      - name: build
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace > build.log 2>&1 || true
          echo "================ WHAT WENT WRONG ================"
          grep -A 25 "What went wrong" build.log || true
          echo "================ TAIL ================"
          tail -n 60 build.log
          test -f app/build/outputs/apk/debug/app-debug.apk
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: kopilka-apk
          path: app/build/outputs/apk/debug/app-debug.apk
