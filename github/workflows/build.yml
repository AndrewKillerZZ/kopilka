name: build
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: make project
        run: |
          mkdir -p app/src/main/java/ru/kopilka/app app/src/main/assets/www app/src/main/res/drawable
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Kopilka"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'ru.kopilka.app'
              compileSdk 34
              defaultConfig {
                  applicationId "ru.kopilka.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies { implementation 'com.yandex.android:mobileads:7.12.0' }
          EOF
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#6B4423" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#E2CFA8" android:pathData="M14,30h80v64h-80z"/>
            <path android:fillColor="#241207" android:pathData="M34,18h40v6h-40z"/>
            <path android:fillColor="#E3B04B" android:pathData="M54,6m-10,0a10,10 0 1,0 20,0a10,10 0 1,0 -20,0"/>
            <path android:fillColor="#A5763D" android:pathData="M20,44h68v2h-68zM20,58h68v2h-68zM20,72h68v2h-68zM36,40h2v40h-2zM54,40h2v40h-2zM72,40h2v40h-2z"/>
          </vector>
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <uses-permission android:name="com.google.android.gms.permission.AD_ID"/>
            <application android:label="Копилка" android:icon="@drawable/ic_launcher"
                android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true"
                  android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/ru/kopilka/app/MainActivity.java <<'EOF'
          package ru.kopilka.app;

          import android.app.Activity;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import com.yandex.mobile.ads.appopenad.AppOpenAd;
          import com.yandex.mobile.ads.appopenad.AppOpenAdEventListener;
          import com.yandex.mobile.ads.banner.BannerAdSize;
          import com.yandex.mobile.ads.banner.BannerAdView;
          import com.yandex.mobile.ads.common.AdError;
          import com.yandex.mobile.ads.common.AdRequest;
          import com.yandex.mobile.ads.common.InitCompletionListener;
          import com.yandex.mobile.ads.common.MobileAds;
          import com.yandex.mobile.ads.rewarded.Reward;
          import com.yandex.mobile.ads.rewarded.RewardedAd;
          import com.yandex.mobile.ads.rewarded.RewardedAdEventListener;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private WebView web;
              private LinearLayout root;
              private BannerAdView banner;
              private AppOpenAd appOpen;
              private long appOpenLoadTime;
              private RewardedAd rewarded;
              private boolean htmlConsent;
              private boolean adsStarted;
              private boolean firstResume = true;
              private SharedPreferences sp;

              static final String BANNER_ID = "demo-banner-yandex";
              static final String APP_OPEN_ID = "demo-appopenad-yandex";
              static final String REWARDED_ID = "demo-rewarded-yandex";

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  sp = getSharedPreferences("ads", 0);
                  TextView splash = new TextView(this);
                  splash.setText("КОПИЛКА");
                  splash.setTextSize(28);
                  splash.setTextColor(0xFF8A5A2B);
                  splash.setGravity(Gravity.CENTER);
                  splash.setBackgroundColor(0xFFF0E3C8);
                  setContentView(splash);

                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  web = new WebView(this);
                  web.getSettings().setJavaScriptEnabled(true);
                  web.getSettings().setDomStorageEnabled(true);
                  web.getSettings().setAllowFileAccess(true);
                  web.setWebViewClient(new WebViewClient());
                  web.addJavascriptInterface(new Bridge(), "AndroidAds");
                  web.loadUrl("file:///android_asset/www/kopilka.html");
                  root.addView(web, new LinearLayout.LayoutParams(-1, 0, 1f));

                  htmlConsent = sp.getBoolean("consent", false);
                  if (htmlConsent) startAds();
              }

              private boolean adFree() {
                  return sp.getLong("af", 0) > System.currentTimeMillis();
              }

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density);
              }

              private void startAds() {
                  if (adsStarted || !htmlConsent) return;
                  adsStarted = true;
                  MobileAds.initialize(this, new InitCompletionListener() {
                      @Override
                      public void onInitializationCompleted() {
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  setContentView(root);
                                  ensureBanner();
                                  loadAppOpen();
                                  loadRewarded();
                                  web.postDelayed(new Runnable() {
                                      @Override
                                      public void run() {
                                          tryAppOpen();
                                      }
                                  }, 700);
                              }
                          });
                      }
                  });
              }

              private void ensureBanner() {
                  if (!adsStarted || adFree() || banner != null) return;
                  banner = new BannerAdView(this);
                  banner.setAdUnitId(BANNER_ID);
                  banner.setAdSize(BannerAdSize.stickyWidth(this));
                  banner.loadAd(new AdRequest.Builder().build());
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1, -2);
                  p.topMargin = dp(8);
                  root.addView(banner, p);
              }

              private void removeBanner() {
                  if (banner != null) {
                      banner.destroy();
                      root.removeView(banner);
                      banner = null;
                  }
              }

              private void loadAppOpen() {
                  appOpen = new AppOpenAd(this);
                  appOpen.setAdUnitId(APP_OPEN_ID);
                  appOpen.setAdEventListener(new AppOpenAdEventListener() {
                      @Override public void onAdShown() {}
                      @Override public void onAdFailedToLoad(AdError e) {}
                      @Override public void onAdDismissed() { loadAppOpen(); }
                      @Override public void onAdClicked() {}
                      @Override public void onAdImpression() {}
                  });
                  appOpen.loadAd(new AdRequest.Builder().build());
                  appOpenLoadTime = System.currentTimeMillis();
              }

              private void tryAppOpen() {
                  if (!adsStarted || adFree() || appOpen == null) return;
                  long now = System.currentTimeMillis();
                  if (now - appOpenLoadTime > 4 * 3600_000L) {
                      appOpen = null;
                      loadAppOpen();
                      return;
                  }
                  if (now - sp.getLong("ao_last", 0) < 4 * 3600_000L) return;
                  if (now - sp.getLong("rw_last", 0) < 10 * 60_000L) return;
                  String today = new SimpleDateFormat("yyyy-MM-dd", Locale.US).format(new Date());
                  if (!today.equals(sp.getString("ao_day", ""))) {
                      sp.edit().putString("ao_day", today).putInt("ao_n", 0).apply();
                  }
                  if (sp.getInt("ao_n", 0) >= 3) return;
                  sp.edit().putLong("ao_last", now).putInt("ao_n", sp.getInt("ao_n", 0) + 1).apply();
                  AppOpenAd ad = appOpen;
                  appOpen = null;
                  ad.show(this);
              }

              private void loadRewarded() {
                  rewarded = new RewardedAd(this);
                  rewarded.setAdUnitId(REWARDED_ID);
                  rewarded.setAdEventListener(new RewardedAdEventListener() {
                      @Override
                      public void onRewarded(Reward r) {
                          sp.edit().putLong("rw_last", System.currentTimeMillis()).apply();
                          grantAdFree(48);
                      }
                      @Override public void onAdFailedToLoad(AdError e) {}
                      @Override public void onAdDismissed() { loadRewarded(); }
                      @Override public void onAdShown() {}
                      @Override public void onAdClicked() {}
                      @Override public void onAdImpression() {}
                  });
                  rewarded.loadAd(new AdRequest.Builder().build());
              }

              private void showRewarded() {
                  if (rewarded == null || !rewarded.isLoaded()) {
                      loadRewarded();
                      web.evaluateJavascript("window.kopilkaAdFreeUnavailable()", null);
                      return;
                  }
                  rewarded.show(this);
              }

              private void grantAdFree(int hours) {
                  sp.edit().putLong("af", System.currentTimeMillis() + hours * 3600_000L).apply();
                  removeBanner();
                  web.evaluateJavascript("window.kopilkaAdFreeGranted(" + hours + ")", null);
              }

              @Override
              protected void onStart() {
                  super.onStart();
                  if (firstResume) {
                      firstResume = false;
                  } else {
                      tryAppOpen();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (banner != null) banner.destroy();
                  web.destroy();
                  super.onDestroy();
              }

              public class Bridge {
                  @JavascriptInterface
                  public void onAppReady() {
                      runOnUiThread(new Runnable() {
                          @Override public void run() { ensureBanner(); }
                      });
                  }

                  @JavascriptInterface
                  public void setConsent(final boolean v) {
                      htmlConsent = v;
                      sp.edit().putBoolean("consent", v).apply();
                      runOnUiThread(new Runnable() {
                          @Override public void run() { startAds(); }
                      });
                  }

                  @JavascriptInterface
                  public void setAdFree(final long ms) {
                      sp.edit().putLong("af", ms).apply();
                      runOnUiThread(new Runnable() {
                          @Override public void run() {
                              if (ms > System.currentTimeMillis()) removeBanner();
                              else ensureBanner();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void showRewardedAdFree() {
                      runOnUiThread(new Runnable() {
                          @Override public void run() { showRewarded(); }
                      });
                  }
              }
          }
          EOF
          cat > app/src/main/assets/www/kopilka.html <<'EOF'
          <!DOCTYPE html>
          <html lang="ru">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <meta name="theme-color" content="#241207">
          <title>Копилка</title>
          <style>
          *{box-sizing:border-box}
          [hidden]{display:none!important}
          body{margin:0;min-height:100vh;color:#3c2a1a;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 2px,transparent 2px 90px),repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 6px),linear-gradient(180deg,#3a2415,#1d0e05);background-attachment:fixed}
          .wrap{max-width:560px;margin:0 auto;padding:16px 12px 14px}
          .box{position:relative;background:repeating-linear-gradient(0deg,rgba(139,94,52,.07) 0 2px,transparent 2px 7px),linear-gradient(180deg,#f0e3c8,#e2cfa8);border:3px solid #9c6b3c;border-radius:14px;padding:16px 14px;box-shadow:0 12px 30px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.5)}
          .soundbtn{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:1.5px solid #b08148;background:rgba(255,255,255,.4);font-size:15px;cursor:pointer}
          .soundbtn.off{opacity:.55}
          .slot{width:46%;height:7px;margin:2px auto 12px;border-radius:4px;background:linear-gradient(180deg,#1d0f06,#4a2c14);box-shadow:inset 0 2px 3px #000,0 1px 0 rgba(255,255,255,.45)}
          .engraved{margin:0;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:21px;font-weight:600;letter-spacing:.45em;text-indent:.45em;color:#8a5a2b;text-shadow:0 1px 0 rgba(255,255,255,.55),0 -1px 1px rgba(93,58,30,.5)}
          .goal{margin:2px 0 12px;text-align:center;font-family:Georgia,serif;font-style:italic;font-size:30px;letter-spacing:.08em;color:#96662f;text-shadow:0 1px 0 rgba(255,255,255,.55),0 -1px 1px rgba(93,58,30,.5)}
          .warn{font-size:12.5px;color:#a2402a;background:rgba(162,64,42,.08);border:1px solid rgba(162,64,42,.4);border-radius:8px;padding:8px;margin:0 0 10px}
          .chip{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 8px;font-size:13px;font-weight:600;color:#6d4522;background:rgba(255,255,255,.35);border:1px dashed #b08148;border-radius:10px;padding:7px 10px;margin-bottom:10px}
          .setup{display:grid;gap:10px}
          .setup label,.fl{font-size:13px;font-weight:700;color:#6d4522}
          .setup label{display:grid;gap:4px}
          .fl{display:block;margin-bottom:4px}
          .setup input[type=number]{font:inherit;font-size:17px;padding:10px 12px;border-radius:10px;border:1.5px solid #b08148;background:#fbf3df;color:#3c2a1a;width:100%}
          .term{display:flex;gap:8px}
          .term input{flex:1;min-width:0}
          .term select{font:inherit;font-size:16px;padding:10px 8px;border-radius:10px;border:1.5px solid #b08148;background:#fbf3df;color:#3c2a1a}
          .pills{display:flex;gap:6px;flex-wrap:wrap}
          .pill{position:relative;flex:1;min-width:90px}
          .pill input{position:absolute;opacity:0;pointer-events:none}
          .pill span{display:block;text-align:center;font-size:13px;font-weight:700;padding:9px 6px;border-radius:10px;border:1.5px solid #b08148;background:#fbf3df;color:#6d4522;cursor:pointer}
          .pill input:checked+span{background:linear-gradient(180deg,#e3b04b,#c98f2e);border-color:#7a4b1f;color:#3a2410}
          .pill input:checked+span::before{content:"✓ "}
          .btn{font:inherit;font-size:16px;font-weight:700;padding:12px;border-radius:10px;border:1.5px solid #7a4b1f;background:linear-gradient(180deg,#e3b04b,#c98f2e);color:#3a2410;cursor:pointer;box-shadow:0 2px 0 #7a4b1f}
          .link{background:none;border:none;padding:4px;font:inherit;font-size:13px;color:#8a5a2b;text-decoration:underline;cursor:pointer}
          .center{justify-self:center}
          .hint{margin:0;font-size:12px;color:#7c5a33}
          .hint.err{color:#a2402a;font-weight:600}
          .pace{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 8px}
          .pace>div{background:rgba(255,255,255,.35);border:1px solid #c9a86b;border-radius:8px;padding:6px 4px;text-align:center}
          .pace span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#8a6a3f;font-weight:700}
          .pace b{font-size:14px;font-weight:800;color:#3c2a1a}
          .pace>div.active{background:linear-gradient(180deg,#f2d391,#e6bc5e);border-color:#a5763d}
          .plan{margin:0 0 10px;font-size:12.5px;text-align:center;color:#7c5a33}
          .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));border-top:1.5px solid #a5763d;border-left:1.5px solid #a5763d;background:rgba(255,255,255,.28)}
          .cell{position:relative;display:flex;flex-direction:column;gap:2px;padding:6px 2px 7px;border-right:1.5px solid #a5763d;border-bottom:1.5px solid #a5763d;text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
          .cell .per{font-size:8.5px;font-weight:600;color:#9a7443}
          .cell .amt{font-family:Georgia,serif;font-style:italic;font-size:14px;color:#6b4423}
          .cell.mid .amt{font-size:12px}.cell.small .amt{font-size:10.5px}.cell.tiny .amt{font-size:9px}
          .cell.paid{background:linear-gradient(180deg,#e7b654,#cf9733)}
          .cell.paid .per{color:#5d3a10}
          .cell.paid .amt{color:#33200d;font-weight:700}
          .cell.paid::after{content:"✓";position:absolute;top:1px;right:3px;font-size:9px;color:#4c2f10}
          .cell.pop{animation:pop .18s ease}
          @keyframes pop{50%{transform:scale(.9)}}
          .float{position:absolute;left:50%;top:0;transform:translateX(-50%);font:700 11px system-ui,sans-serif;color:#8a5a10;white-space:nowrap;pointer-events:none;animation:floatUp .7s ease forwards;z-index:2}
          .float.neg{color:#a2402a}
          @keyframes floatUp{to{transform:translate(-50%,-22px);opacity:0}}
          .tip{margin:10px 0 0;font-size:12px;text-align:center;color:#7c5a33}
          .stats{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));z-index:5;margin-top:14px;padding:10px 12px;border:2px solid #9c6b3c;border-radius:12px;background:linear-gradient(180deg,#f6ecd6,#ecd9b4);box-shadow:0 -6px 18px rgba(0,0,0,.4)}
          .done{margin:0 0 8px;text-align:center;font-weight:800;font-size:16px;color:#7a4b1f;background:linear-gradient(180deg,#f4d98b,#e9bd55);border:1.5px solid #a5763d;border-radius:8px;padding:8px}
          .row{display:flex;justify-content:space-between;gap:10px}
          .right{text-align:right}
          .lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8a6a3f}
          .val{font-size:20px;font-weight:800}
          .val.gold{color:#9c6a10}
          .times{margin-top:2px;font-size:10.5px;line-height:1.35;color:#7c5a33}
          .times b{color:#6d4522}
          .bar{height:8px;margin:8px 0 6px;border-radius:5px;background:#d9c39a;overflow:hidden}
          #fill{height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#e3b04b,#c98f2e);transition:width .25s}
          .sub{font-size:12px;color:#7c5a33}
          .foot{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;margin-top:10px}
          .foot .link{color:#caa06a}
          .toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:8px;align-items:center;max-width:92vw;padding:8px 12px;border:2px solid #9c6b3c;border-radius:10px;background:linear-gradient(180deg,#f6ecd6,#ecd9b4);font-size:13px;font-weight:600;color:#3c2a1a}
          .adfree{margin:0 0 8px;text-align:center}
          .afchip{display:inline-block;font-size:12px;font-weight:700;color:#6d4522;background:rgba(255,255,255,.45);border:1px dashed #b08148;border-radius:8px;padding:5px 10px}
          .afbtn{font:inherit;font-size:13px;font-weight:700;padding:8px 12px;border-radius:10px;border:1.5px solid #7a4b1f;background:linear-gradient(180deg,#e3b04b,#c98f2e);color:#3a2410;cursor:pointer}
          #adConsent{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(20,10,4,.65);padding:16px}
          #adConsent .card{max-width:420px;background:linear-gradient(180deg,#f6ecd6,#ecd9b4);border:2px solid #9c6b3c;border-radius:12px;padding:14px;font-size:13px;line-height:1.45;color:#3c2a1a}
          #adConsent h3{margin:0 0 6px;font-family:Georgia,serif}
          #adConsent .btns{display:flex;gap:8px;margin-top:10px}
          #adConsent button{flex:1;font:inherit;font-weight:700;padding:10px;border-radius:10px;border:1.5px solid #7a4b1f;cursor:pointer}
          #adConsent .ok{background:linear-gradient(180deg,#e3b04b,#c98f2e);color:#3a2410}
          #adConsent .no{background:#fbf3df;color:#6d4522}
          </style>
          </head>
          <body>
          <main class="wrap">
            <section class="box">
              <button type="button" class="soundbtn" id="soundBtn" aria-label="Звук включён">🔊</button>
              <div class="slot"></div>
              <h1 class="engraved">КОПИЛКА</h1>
              <div class="goal" id="goalEngraved">100 000</div>
              <p class="warn" id="storeWarn" hidden>⚠️ Браузер запретил сохранение данных. Прогресс пропадёт после закрытия.</p>
              <div class="chip" id="chip" hidden>
                <span id="chipText"></span>
                <button type="button" class="link" id="editBtn">изменить</button>
              </div>
              <form id="setup" class="setup">
                <label>Цель, ₽
                  <input id="targetInput" type="number" inputmode="numeric" min="100" step="1" value="100000" required>
                </label>
                <div>
                  <span class="fl">Срок</span>
                  <div class="term">
                    <input id="termInput" type="number" inputmode="numeric" min="1" step="1" value="12" required>
                    <select id="termUnit">
                      <option value="day">дн.</option>
                      <option value="week">нед.</option>
                      <option value="month" selected>мес.</option>
                    </select>
                  </div>
                </div>
                <div>
                  <span class="fl">Делить таблицу на</span>
                  <div class="pills">
                    <label class="pill"><input type="radio" name="split" value="day"><span>По дням</span></label>
                    <label class="pill"><input type="radio" name="split" value="week" checked><span>По неделям</span></label>
                    <label class="pill"><input type="radio" name="split" value="month"><span>По месяцам</span></label>
                  </div>
                </div>
                <button type="submit" class="btn">Создать копилку</button>
                <button type="button" class="link center" id="cancelEdit" hidden>отмена</button>
                <p class="hint" id="setupHint">Одна клетка — один взнос за период. Каждая клетка подписана: день, неделя или месяц по порядку.</p>
              </form>
              <div class="pace" id="pace" hidden>
                <div data-u="day"><span>в день</span><b id="paceDay"></b></div>
                <div data-u="week"><span>в неделю</span><b id="paceWeek"></b></div>
                <div data-u="month"><span>в месяц</span><b id="paceMonth"></b></div>
              </div>
              <p class="plan" id="plan" hidden></p>
              <div class="grid" id="grid" hidden></div>
              <p class="tip" id="tip" hidden>Нажми на клетку — взнос засчитается. Повторное нажатие отменяет его.</p>
            </section>
            <section class="stats" id="stats" hidden>
              <div class="done" id="done" hidden>🎉 Цель достигнута!</div>
              <div class="row">
                <div><span class="lbl">Внесено</span><span class="val gold" id="paidVal">0 ₽</span></div>
                <div class="right"><span class="lbl">Осталось</span><span class="val" id="leftVal">0 ₽</span></div>
              </div>
              <div class="row times">
                <div id="paidTime"></div>
                <div id="leftTime" class="right"></div>
              </div>
              <div class="bar"><div id="fill"></div></div>
              <div class="sub" id="sub"></div>
            </section>
            <footer class="foot" id="foot" hidden>
              <button type="button" class="link" id="resetBtn">сбросить отметки</button>
              <button type="button" class="link" id="exportBtn">сохранить копию</button>
              <button type="button" class="link" id="importBtn">загрузить копию</button>
              <input type="file" id="importFile" accept=".json,application/json" hidden>
            </footer>
          </main>
          <div class="toast" id="toast" hidden><span id="toastMsg"></span><button type="button" class="link" id="toastAct" hidden></button></div>
          <script>
          'use strict';
          var KEY='kopilka-v1', SND_KEY='kopilka-v1-sound';
          var UNITS={day:{days:1,short:'дн.',max:365,names:['день','дня','дней']},week:{days:7,short:'нед.',max:156,names:['неделя','недели','недель']},month:{days:30,short:'мес.',max:36,names:['месяц','месяца','месяцев']}};
          var SPLIT_LABEL={day:'по дням',week:'по неделям',month:'по месяцам'};
          function $(id){return document.getElementById(id);}
          var fmt=new Intl.NumberFormat('ru-RU');
          var state=null, prevLeft=null, audio=null;
          var soundOn=true; try{soundOn=localStorage.getItem(SND_KEY)!=='0';}catch(e){}
          function plural(n,f){var a=Math.abs(n)%100,d=a%10;if(a>10&&a<20)return f[2];if(d>1&&d<5)return f[1];if(d===1)return f[0];return f[2];}
          function fmtCount(n,u){return n+' '+plural(n,UNITS[u].names);}
          function fmtFrac(x){return x.toLocaleString('ru-RU',{maximumFractionDigits:x>=10?0:1});}
          function secUnits(days,skip){var out=[];['day','week','month'].forEach(function(u){if(u!==skip)out.push('≈ '+fmtFrac(days/UNITS[u].days)+' '+UNITS[u].short);});return out.join(' · ');}
          function tone(freq,delay,dur,gain){var t=audio.currentTime+delay;var o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+dur+0.02);}
          function play(kind){if(!soundOn)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();if(kind==='coin'){tone(2093,0,0.18,0.06);tone(3136,0.01,0.14,0.03);}else if(kind==='undo'){tone(660,0,0.12,0.04);}else if(kind==='win'){tone(1046,0,0.25,0.06);tone(1318,0.09,0.25,0.06);tone(1568,0.18,0.4,0.07);}}catch(e){}}
          function paintSound(){var b=$('soundBtn');b.textContent=soundOn?'🔊':'';b.classList.toggle('off',!soundOn);}
          $('soundBtn').addEventListener('click',function(){soundOn=!soundOn;try{localStorage.setItem(SND_KEY,soundOn?'1':'0');}catch(e){}paintSound();if(soundOn)play('coin');});
          var toastTimer=null,toastFn=null;
          function toast(msg,actLabel,fn){$('toastMsg').textContent=msg;var b=$('toastAct');if(actLabel){b.hidden=false;b.textContent=actLabel;toastFn=fn;}else{b.hidden=true;toastFn=null;}$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){$('toast').hidden=true;},6000);}
          $('toastAct').addEventListener('click',function(){if(toastFn)toastFn();$('toast').hidden=true;clearTimeout(toastTimer);});
          function snapshot(){return JSON.parse(JSON.stringify(state));}
          function restore(snap){state=snap;prevLeft=null;save();renderAll();toast('Прогресс восстановлен');}
          function valid(s){return s&&Number.isFinite(s.target)&&s.target>0&&(Number.isFinite(s.term)||Number.isFinite(s.months))&&Array.isArray(s.cells)&&s.cells.length>0&&s.cells.length<=2000&&s.cells.every(function(c){return c&&Number.isFinite(c.v)&&c.v>0;});}
          function normalizeState(s){if(!valid(s))return null;var term=Number.isFinite(s.term)?s.term:(Number.isFinite(s.months)?s.months:12);var unit=UNITS[s.unit]?s.unit:'month';var split=UNITS[s.split]?s.split:'week';return {target:Math.round(s.target),term:Math.max(1,Math.round(term)),unit:unit,split:split,cells:s.cells.map(function(c){return {v:Math.round(c.v),p:!!c.p};})};}
          function load(){try{return normalizeState(JSON.parse(localStorage.getItem(KEY)));}catch(e){return null;}}
          function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){$('storeWarn').hidden=false;}}
          function generate(total,n){var avg=total/n;var step=avg>=150?50:avg>=30?10:1;var w=[];for(var i=0;i<n;i++){w.push(n<8?0.6+Math.random():0.15+Math.pow(Math.random(),2)*3.85);}var sw=w.reduce(function(a,b){return a+b;},0);var vals=w.map(function(x){return Math.max(step,Math.round(total*x/sw/step)*step);});var diff=total-vals.reduce(function(a,b){return a+b;},0),guard=0;while(diff!==0&&guard++<200000){var i2=Math.floor(Math.random()*n);if(diff>0){var a=Math.min(step,diff);vals[i2]+=a;diff-=a;}else{var s=Math.min(step,-diff,vals[i2]-step);if(s>0){vals[i2]-=s;diff+=s;}}}if(diff!==0){var m=0;vals.forEach(function(v,j){if(v>vals[m])m=j;});vals[m]+=diff;}return vals;}
          function cellTitle(c,i){return UNITS[state.split].names[0]+' '+(i+1)+': '+fmt.format(c.v)+' ₽, '+(c.p?'внесено':'не внесено');}
          function buildGrid(){var frag=document.createDocumentFragment();var perName=UNITS[state.split].names[0];state.cells.forEach(function(c,i){var d=document.createElement('div');var len=String(c.v).length;d.className='cell'+(len>=7?' tiny':len>=6?' small':len===5?' mid':'')+(c.p?' paid':'');var per=document.createElement('span');per.className='per';per.textContent=perName+' '+(i+1);var amt=document.createElement('span');amt.className='amt';amt.textContent=fmt.format(c.v);d.appendChild(per);d.appendChild(amt);d.dataset.i=i;d.tabIndex=0;d.setAttribute('role','button');d.setAttribute('aria-pressed',String(!!c.p));d.title=cellTitle(c,i);frag.appendChild(d);});$('grid').replaceChildren(frag);}
          function updateStats(){var paid=0,cnt=0;state.cells.forEach(function(c){if(c.p){paid+=c.v;cnt++;}});var left=state.target-paid;var leftCnt=state.cells.length-cnt;var pct=Math.min(100,Math.round(paid/state.target*100));$('paidVal').textContent=fmt.format(paid)+' ₽';$('leftVal').textContent=fmt.format(left)+' ₽';var ud=UNITS[state.split].days;$('paidTime').innerHTML=cnt?'<b>'+fmtCount(cnt,state.split)+'</b> · '+secUnits(cnt*ud,state.split):'пока ничего не внесено';$('leftTime').innerHTML=leftCnt?'<b>'+fmtCount(leftCnt,state.split)+'</b> · '+secUnits(leftCnt*ud,state.split):'цель закрыта 🎉';$('fill').style.width=pct+'%';$('sub').textContent=cnt+' из '+state.cells.length+' клеток · '+pct+'%';$('done').hidden=left!==0;if(left===0&&prevLeft!==null&&prevLeft!==0)play('win');prevLeft=left;}
          function showSetup(open){$('setup').hidden=!open;$('chip').hidden=open||!state;$('cancelEdit').hidden=!state;if(open&&state){$('targetInput').value=state.target;$('termInput').value=state.term;$('termUnit').value=state.unit;var r=document.querySelector('input[name="split"][value="'+state.split+'"]');if(r)r.checked=true;}}
          function renderAll(){var totalDays=state.term*UNITS[state.unit].days;var perDay=state.target/totalDays;$('goalEngraved').textContent=fmt.format(state.target);$('chipText').textContent='Цель '+fmt.format(state.target)+' ₽ · '+state.term+' '+UNITS[state.unit].short+' · '+SPLIT_LABEL[state.split];$('paceDay').textContent='≈ '+fmt.format(Math.round(perDay))+' ₽';$('paceWeek').textContent='≈ '+fmt.format(Math.round(perDay*7))+' ₽';$('paceMonth').textContent='≈ '+fmt.format(Math.round(perDay*30))+' ₽';Array.prototype.forEach.call($('pace').children,function(el){el.classList.toggle('active',el.dataset.u===state.split);});var n=state.cells.length;$('plan').textContent='1 клетка = 1 '+UNITS[state.split].names[0]+' · всего '+n+' '+plural(n,['клетка','клетки','клеток'])+' · в среднем '+fmt.format(Math.round(state.target/n))+' ₽';['pace','plan','grid','tip','stats','foot'].forEach(function(id){$(id).hidden=false;});showSetup(false);buildGrid();updateStats();}
          function hintError(msg){var h=$('setupHint');h.textContent=msg;h.classList.add('err');}
          function hintDefault(){var h=$('setupHint');h.textContent='Одна клетка — один взнос за период. Каждая клетка подписана: день, неделя или месяц по порядку.';h.classList.remove('err');}
          $('setup').addEventListener('submit',function(e){e.preventDefault();var total=Math.round(Number($('targetInput').value));var unit=$('termUnit').value;var term=Math.round(Number($('termInput').value));var r=document.querySelector('input[name="split"]:checked');var split=r?r.value:'week';if(!Number.isFinite(total)||total<100)return hintError('Введите сумму от 100 ₽.');if(!Number.isFinite(term)||term<1||term>UNITS[unit].max)return hintError('Срок: от 1 до '+UNITS[unit].max+' '+UNITS[unit].short);var totalDays=term*UNITS[unit].days;var n=split==='day'?totalDays:Math.max(1,Math.round(totalDays/UNITS[split].days));if(total<n)return hintError('Для такого срока сумма должна быть не меньше '+fmt.format(n)+' ₽.');var hadProgress=state&&state.cells.some(function(c){return c.p;});if(hadProgress&&!confirm('Создать новую копилку? Текущие отметки и прогресс сбросятся.'))return;var snap=hadProgress?snapshot():null;state={target:total,term:term,unit:unit,split:split,cells:generate(total,n).map(function(v){return {v:v,p:false};})};prevLeft=null;save();hintDefault();renderAll();toast('Копилка создана',snap?'Вернуть':null,snap?function(){restore(snap);}:null);});
          $('editBtn').addEventListener('click',function(){showSetup(true);});
          $('cancelEdit').addEventListener('click',function(){hintDefault();showSetup(false);});
          function toggleCell(el){var i=+el.dataset.i,c=state.cells[i];c.p=!c.p;el.classList.toggle('paid',c.p);el.setAttribute('aria-pressed',String(c.p));el.title=cellTitle(c,i);el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');var f=document.createElement('span');f.className='float'+(c.p?'':' neg');f.textContent=(c.p?'+':'−')+fmt.format(c.v)+' ₽';el.appendChild(f);f.addEventListener('animationend',function(){f.remove();});setTimeout(function(){f.remove();},900);if(navigator.vibrate)navigator.vibrate(8);play(c.p?'coin':'undo');save();updateStats();}
          $('grid').addEventListener('click',function(e){var el=e.target.closest('.cell');if(el)toggleCell(el);});
          $('grid').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){var el=e.target.closest('.cell');if(el){e.preventDefault();toggleCell(el);}}});
          $('resetBtn').addEventListener('click',function(){if(!state)return;if(!state.cells.some(function(c){return c.p;})){toast('Отметок пока нет');return;}var snap=snapshot();state.cells.forEach(function(c){c.p=false;});prevLeft=null;save();buildGrid();updateStats();play('undo');toast('Отметки сброшены','Вернуть',function(){restore(snap);});});
          $('exportBtn').addEventListener('click',function(){if(!state)return;var blob=new Blob([JSON.stringify(state)],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='kopilka-'+state.target+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1000);toast('Копия сохранена в файл');});
          $('importBtn').addEventListener('click',function(){$('importFile').click();});
          $('importFile').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var reader=new FileReader();reader.onload=function(){try{var s=normalizeState(JSON.parse(reader.result));if(!s)throw new Error();var hadProgress=state&&state.cells.some(function(c){return c.p;});if(hadProgress&&!confirm('Заменить текущую копилку данными из файла?'))return;var snap=hadProgress?snapshot():null;state=s;prevLeft=null;save();renderAll();toast('Копилка восстановлена из копии',snap?'Вернуть':null,snap?function(){restore(snap);}:null);}catch(err){alert('Не получилось: файл не похож на копию копилки.');}e.target.value='';};reader.readAsText(f);});
          try{localStorage.setItem(KEY+'-t','1');localStorage.removeItem(KEY+'-t');}catch(e){$('storeWarn').hidden=false;}
          paintSound();
          state=load();
          if(state)renderAll();else showSetup(true);
          </script>
          <script>
          (function(){
          'use strict';
          var A=window.AndroidAds||null, CK='kopilka-v1-consent', AF='kopilka-v1-adfree';
          var consent=false;try{consent=localStorage.getItem(CK)==='1';}catch(e){}
          function until(){try{return +localStorage.getItem(AF)||0;}catch(e){return 0;}}
          function active(){return until()>Date.now();}
          function leftText(){var ms=until()-Date.now(),h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);return h+' ч '+m+' мин';}
          var row=document.createElement('div');row.className='adfree';
          var stats=document.getElementById('stats');
          if(stats)stats.insertBefore(row,stats.firstChild);
          function paint(){if(!row)return;if(active()){row.innerHTML='<span class="afchip">🕊 Без рекламы ещё '+leftText()+'</span>';return;}row.innerHTML='<button type="button" class="afbtn">🎬 Убрать рекламу на 48 ч</button>';row.firstChild.onclick=function(){if(!A){toast('Реклама есть только в приложении');return;}if(active()){paint();return;}A.showRewardedAdFree();};}
          window.kopilkaAdFreeGranted=function(h){var ms=Date.now()+(h||48)*36e5;try{localStorage.setItem(AF,String(ms));}catch(e){}if(A)A.setAdFree(ms);paint();toast('Готово: '+(h||48)+' ч без рекламы 🕊');};
          window.kopilkaAdFreeUnavailable=function(){toast('Реклама ещё не загрузилась — попробуй через минуту');};
          function setConsent(v){consent=v;try{localStorage.setItem(CK,v?'1':'0');}catch(e){}if(A)A.setConsent(v);}
          if(A){if(consent){A.setConsent(true);}else{var ov=document.createElement('div');ov.id='adConsent';ov.innerHTML='<div class="card"><h3>Реклама и данные</h3><p>Приложение бесплатно и показывает рекламу через Яндекс Рекламу. Для подбора рекламы используется рекламный идентификатор устройства. Обработка — по политике конфиденциальности (ссылка в карточке приложения). Можно отказаться: приложение продолжит работать без рекламы.</p><div class="btns"><button type="button" class="no">Отказаться</button><button type="button" class="ok">Принимаю</button></div></div>';document.body.appendChild(ov);ov.querySelector('.ok').onclick=function(){setConsent(true);ov.remove();};ov.querySelector('.no').onclick=function(){setConsent(false);ov.remove();};}A.setAdFree(until());A.onAppReady();}
          paint();setInterval(paint,60000);
          })();
          </script>
          </body>
          </html>
          EOF
